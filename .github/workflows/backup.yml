name: Respaldo semanal

# Genera un ZIP cifrado (AES-256) con todas las tablas y lo guarda 30 días como artefacto.
# Requiere estos secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, BACKUP_PASSWORD
# Sin BACKUP_PASSWORD no hace nada: nunca se sube un respaldo sin cifrar.
# ⚠️ En un repositorio PÚBLICO los artefactos son visibles: usa un repositorio privado.

on:
  schedule:
    - cron: "0 7 * * 1"   # lunes 07:00 UTC (02:00 hora de Perú)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Comprobar configuración
        run: |
          if [ -z "$BACKUP_PASSWORD" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Faltan secretos (SUPABASE_URL, SUPABASE_SERVICE_KEY, BACKUP_PASSWORD): no se genera respaldo."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - if: env.SKIP != '1'
        run: pip install -r requirements.txt
      - if: env.SKIP != '1'
        run: python scripts/backup.py --require-password
      - if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-mrp
          path: backups/*.zip
          retention-days: 30
